[project]
name = "malmoi"
version = "0.1.0"
description = "Malmoi (말모이): a Korean vocabulary agent for advanced learners"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "genanki>=0.13.1",
    "google-cloud-firestore>=2.34.0",
    "google-genai>=2.28.0",
    "httpx>=0.28.1",
    "kiwipiepy>=0.24.0",
    "korean-romanizer>=0.28.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
